<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3584e4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c71d8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон - щит -->
  <path d="M64 8 L108 24 L108 72 C108 96 64 116 64 116 C64 116 20 96 20 72 L20 24 Z" 
        fill="url(#bg-gradient)" 
        stroke="#1a5fb4" 
        stroke-width="2"
        filter="url(#shadow)"/>
  
  <!-- Сетевая иконка внутри щита -->
  <g transform="translate(64, 60)" fill="#ffffff">
    <!-- Центральный узел -->
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
    
    <!-- Линии сети -->
    <line x1="-28" y1="-20" x2="-10" y2="-8" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="-20" x2="10" y2="-8" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="28" x2="0" y2="12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Узлы -->
    <circle cx="-28" cy="-20" r="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="28" cy="-20" r="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="28" r="8" fill="#ffffff" opacity="0.9"/>
    
    <!-- Галочка статуса -->
    <path d="M-6 0 L0 6 L8 -4" stroke="#1c71d8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Блик -->
  <ellipse cx="45" cy="30" rx="15" ry="8" fill="#ffffff" opacity="0.2" transform="rotate(-30 45 30)"/>
</svg>
